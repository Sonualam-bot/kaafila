services:
  auth-db:
    image: postgres:16
    env_file:
      - ../.env
    ports:
      - '5432:5432'
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    restart: unless-stopped
  
  auth-service:
    build: ../services/auth
    env_file: 
      - ../.env
    ports:
      - '3001:3001'
    depends_on:
      - auth-db
    restart: unless-stopped

volumes:
  auth-db-data:
